<nav class="navbar" [class.scrolled]="scrolled()">
    <div class="nav-inner container">
        <a href="#hero" class="nav-logo">
            <span class="logo-text">HD</span>
        </a>

        <div class="nav-links" [class.open]="menuOpen()">
            <a href="#about" (click)="closeMenu()">About</a>
            <a href="#projects" (click)="closeMenu()">Projects</a>
            <a href="#stories" (click)="closeMenu()">Stories</a>
            <a href="#contact" (click)="closeMenu()" class="nav-cta">Contact</a>
        </div>
        <!-- Colle ce bloc juste avant <button class="nav-burger"> -->
        <button class="theme-toggle" (click)="theme.toggle()"
            [title]="theme.theme() === 'dark' ? 'Mode clair' : 'Mode sombre'">
            <!-- Icône soleil (mode clair) -->
            <svg *ngIf="theme.theme() === 'dark'" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="5" />
                <line x1="12" y1="1" x2="12" y2="3" />
                <line x1="12" y1="21" x2="12" y2="23" />
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                <line x1="1" y1="12" x2="3" y2="12" />
                <line x1="21" y1="12" x2="23" y2="12" />
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
            <!-- Icône lune (mode sombre) -->
            <svg *ngIf="theme.theme() === 'light'" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
            </svg>
        </button>
        <button class="nav-burger" (click)="toggleMenu()" [class.active]="menuOpen()" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </div>
</nav>
